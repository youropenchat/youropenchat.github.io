<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenChat - Lansman Geri Sayımı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Arka plan animasyonu */
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Sayfa yüklenme animasyonları */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      overflow: hidden;
    }
    
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
    }
    
    main {
      position: relative;
      z-index: 1;
    }

    /* Fareyi takip eden parlama efekti için */
    #card-container::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(
        400px circle at var(--mouse-x) var(--mouse-y),
        rgba(147, 112, 219, 0.2),
        transparent 40%
      );
      border-radius: inherit;
      padding: 1px;
      transition: background 0.3s ease;
    }

    .countdown-number {
        background: -webkit-linear-gradient(45deg, #c7d2fe, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white p-5 text-center">

  <div id="particles-js"></div>

  <main id="card-container" class="relative bg-slate-900/40 backdrop-blur-xl p-6 sm:p-10 rounded-3xl shadow-2xl border border-white/10 max-w-2xl w-full">
    <header class="mb-6 opacity-0 fade-in" style="animation-delay: 0.2s;">
      <h1 class="text-5xl md:text-6xl font-black tracking-tighter">OpenChat</h1>
      <p class="mt-4 text-base md:text-lg max-w-md mx-auto leading-relaxed text-slate-300">
        Geleceğin sohbet platformu için hazırlanıyoruz. Beta sürecimiz devam ediyor. Lansman tarihimiz: <strong>20 Temmuz 2025, 12:00</strong>
        <br>- OpenChat Ekibi
      </p>
    </header>

    <div id="countdown" class="flex justify-center gap-2 sm:gap-4 my-8 text-center opacity-0 fade-in" style="animation-delay: 0.4s;">
        <div class="bg-slate-800/50 p-3 sm:p-4 rounded-lg w-20 sm:w-24">
            <div id="days" class="text-4xl sm:text-5xl font-bold countdown-number">0</div>
            <div class="text-xs uppercase tracking-widest text-slate-400">Gün</div>
        </div>
        <div class="bg-slate-800/50 p-3 sm:p-4 rounded-lg w-20 sm:w-24">
            <div id="hours" class="text-4xl sm:text-5xl font-bold countdown-number">0</div>
            <div class="text-xs uppercase tracking-widest text-slate-400">Saat</div>
        </div>
        <div class="bg-slate-800/50 p-3 sm:p-4 rounded-lg w-20 sm:w-24">
            <div id="minutes" class="text-4xl sm:text-5xl font-bold countdown-number">0</div>
            <div class="text-xs uppercase tracking-widest text-slate-400">Dakika</div>
        </div>
        <div class="bg-slate-800/50 p-3 sm:p-4 rounded-lg w-20 sm:w-24">
            <div id="seconds" class="text-4xl sm:text-5xl font-bold countdown-number">0</div>
            <div class="text-xs uppercase tracking-widest text-slate-400">Saniye</div>
        </div>
    </div>

    <div class="button-container mt-8 flex flex-col sm:flex-row justify-center items-center gap-4 opacity-0 fade-in" style="animation-delay: 0.6s;">
      <button class="group relative w-full sm:w-auto inline-flex items-center justify-center py-3 px-8 font-bold text-white transition-all duration-300 bg-slate-800 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500" onclick="window.location.href='v1.html'">
        <span class="absolute -inset-full_top-0_left-0 w-full h-full rounded-full bg-gradient-to-br from-indigo-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
        <span class="relative">OpenChat v1</span>
      </button>
      <button class="group relative w-full sm:w-auto inline-flex items-center justify-center py-3 px-8 font-bold text-slate-900 transition-all duration-300 bg-slate-50 rounded-full hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-slate-50" onclick="window.location.href='v2.html'">
        <span class="relative">OpenChat v2</span>
      </button>
    </div>

    <div class="warning mt-8 bg-amber-500/10 text-amber-400 p-3 px-5 rounded-lg max-w-md mx-auto font-semibold text-sm border border-amber-500/20 opacity-0 fade-in" style="animation-delay: 0.8s;">
      Uyarı: Site beta aşamasındadır ve bazı özellikler beklendiği gibi çalışmayabilir.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  
  <script>
    // Parçacık efektini daha premium bir his için ayarla
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
        "size": { "value": 2, "random": true, "anim": { "enable": false } },
        "line_linked": { "enable": false },
        "move": { "enable": true, "speed": 1, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
      },
      "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": false }, "onclick": { "enable": false } } },
      "retina_detect": true
    });

    // Kartın parlama efekti
    const card = document.getElementById('card-container');
    card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
    });

    // Geri sayım mantığı
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const countdownContainer = document.getElementById('countdown');
    const targetDate = new Date('2025-07-20T12:00:00');

    function updateCountdown() {
      const now = new Date();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownContainer.innerHTML = '<div class="text-2xl font-bold text-green-400">Lansman Zamanı Geldi! Yönlendiriliyorsunuz...</div>';
        clearInterval(interval);
        setTimeout(() => { window.location.href = 'https://youropenchat.github.io/'; }, 3000);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.textContent = days.toString().padStart(2, '0');
      hoursEl.textContent = hours.toString().padStart(2, '0');
      minutesEl.textContent = minutes.toString().padStart(2, '0');
      secondsEl.textContent = seconds.toString().padStart(2, '0');
    }

    const interval = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
