<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenChat - Yeni Tasarım</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Cloudinary Upload Widget SDK -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    /* --- Genel Ayarlar --- */
    :root {
      --background-color: #f0f2f5;
      --chat-background-color: #ffffff;
      --primary-color: #005cff;
      --sent-message-bg: #d9fdd3;
      --received-message-bg: #ffffff;
      --text-primary: #050505;
      --text-secondary: #65676b;
      --border-color: #e9edef;
      --whatsapp-bg-color: #e5ddd5;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
      overflow: hidden;
    }
    button, input {
      outline: none;
      font-family: inherit;
      border: none;
    }

    /* --- Ana Konteyner --- */
    #app-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 20px;
    }

    /* --- Giriş Modalı --- */
    #authModal {
        background: var(--chat-background-color);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    #authModal h2 {
        font-size: 24px;
        margin-bottom: 20px;
    }
    #authModal input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
    }
    #authModal .btn {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        margin-top: 8px;
        cursor: pointer;
        background-color: var(--primary-color);
        color: white;
    }
    #authModal .btn.danger {
        background-color: #6c757d;
    }
    #authModal .error {
        color: #fa383e;
        margin-top: 12px;
        min-height: 20px;
    }

    /* --- Sohbet Konteyneri --- */
    #chat {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 900px;
      background: var(--chat-background-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* --- Sohbet Başlığı --- */
    #chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: #f0f2f5;
    }
    #chat-header .title-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #chat-header h2 {
        font-size: 18px;
        font-weight: 600;
    }
    #chat-header .status-tag {
        background-color: #31a24c;
        color: white;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
    }
    #chat-header .header-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #chat-header .btn-logout, #chat-header .btn-admin {
        background-color: #fa383e;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
    }
     #chat-header .btn-admin {
        background-color: #6c757d;
    }
    #chat-header .btn-logout:hover {
        background-color: #e02c34;
    }
    #chat-header .btn-admin:hover {
        background-color: #5a6268;
    }

    /* --- Mesajlar Alanı --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: var(--whatsapp-bg-color);
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
    }
    .message-wrapper {
        display: flex;
        margin-bottom: 12px;
        position: relative;
    }
    .message-wrapper.sent {
        justify-content: flex-end;
    }
    .message-wrapper.received {
        justify-content: flex-start;
    }
    .message {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 70%;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .message.sent {
        background-color: var(--sent-message-bg);
    }
    .message.received {
        background-color: var(--received-message-bg);
    }
    .message .author {
        font-weight: 600;
        margin-bottom: 4px;
        font-size: 13px;
        color: var(--primary-color);
        cursor: pointer;
    }
    .message .content {
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
    }
    .message .time {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 4px;
        text-align: right;
    }
    .message img {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 5px;
        cursor: pointer;
    }
    .message-actions {
        position: absolute;
        top: -15px;
        background-color: white;
        border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        display: flex;
        gap: 5px;
        padding: 5px;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        transform: translateY(5px);
        pointer-events: none;
    }
    .message-wrapper:hover .message-actions {
        opacity: 1;
        transform: translateY(0);
        pointer-events: all;
    }
    .message-wrapper.sent .message-actions {
        right: 10px;
    }
    .message-wrapper.received .message-actions {
        left: 10px;
    }
    .action-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
    }
    .action-btn svg {
        width: 18px;
        height: 18px;
        color: var(--text-secondary);
    }
    .action-btn:hover svg {
        color: var(--text-primary);
    }

    /* --- Giriş Alanı --- */
    #inputArea {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: #f0f2f5;
      border-top: 1px solid var(--border-color);
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 20px;
      background-color: white;
      font-size: 15px;
      border: 1px solid #ccd0d5;
    }
    #inputArea .icon-btn {
        background: none;
        border: none;
        padding: 8px;
        margin-left: 8px;
        cursor: pointer;
    }
    #inputArea .icon-btn svg {
        width: 24px;
        height: 24px;
        color: #65676b;
    }
    #inputArea .send-btn svg {
        color: var(--primary-color);
    }
    #user-id-display {
        position: absolute;
        bottom: 5px;
        left: 25px;
        font-size: 10px;
        color: #8a8d91;
    }
    
    /* --- Admin Modal --- */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-content h3 {
        margin-bottom: 20px;
    }
    .modal-content .admin-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .modal-content .admin-buttons button {
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        background-color: #f0f2f5;
        border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Giriş/Kayıt Modalı -->
    <div id="authModal">
      <h2>OpenChat'e Hoş Geldiniz</h2>
      <input type="text" id="authUsername" placeholder="Kullanıcı Adı" autocomplete="username">
      <input type="password" id="authPassword" placeholder="Şifre" autocomplete="current-password">
      <button class="btn" onclick="login()">Giriş Yap</button>
      <button class="btn danger" onclick="register()">Kayıt Ol</button>
      <div id="authError" class="error"></div>
    </div>

    <!-- Sohbet Ekranı -->
    <div id="chat">
      <div id="chat-header">
        <div class="title-group">
            <h2>Genel Sohbet</h2>
            <span class="status-tag">Aktif</span>
        </div>
        <div class="header-buttons">
            <button id="adminBtn" class="btn-admin" style="display: none;" onclick="openAdminModal()">Admin Paneli</button>
            <button class="btn-logout" onclick="logout()">Çıkış</button>
        </div>
      </div>
      
      <div id="messages"></div>

      <div id="inputArea">
        <div style="flex:1; position:relative;">
            <input id="messageInput" placeholder="Bir mesaj yazın..." autocomplete="off" />
            <div id="user-id-display"></div>
        </div>
        <button id="upload_widget" class="icon-btn" title="Dosya Ekle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M14.707,12.707,5.293,3.293A1,1,0,0,1,6.707,1.879l10,10a1,1,0,0,1,0,1.414l-4,4a1,1,0,0,1-1.414-1.414L14.586,13H3a1,1,0,0,1,0-2H14.586Z" transform="rotate(45 12 12)"/></svg>
        </button>
        <button id="sendBtn" class="icon-btn send-btn" onclick="send()" title="Gönder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M2.01,21,23,12,2.01,3,2,10l15,2L2,14Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Admin Paneli Modalı -->
  <div id="adminModalContainer" class="modal-overlay">
      <div class="modal-content">
          <h3>Admin Paneli</h3>
          <div class="admin-buttons">
              <button onclick="banUser()">Kullanıcı Banla</button>
              <button onclick="unbanUser()">Ban Kaldır</button>
              <button onclick="deleteAllMessages()">Tüm Mesajları Sil</button>
              <button onclick="announce()">Duyuru Yap</button>
          </div>
          <br>
          <button class="btn-logout" style="width: 100%;" onclick="closeAdminModal()">Kapat</button>
      </div>
  </div>

<script>
  // --- Firebase Konfigürasyonu ---
  const firebaseConfig = {
    apiKey: "AIzaSyAWA4a9VSTPUKWe4Pqsc6U6O0hrdFGlOd0",
    authDomain: "openchat2.firebaseapp.com",
    databaseURL: "https://openchat2-default-rtdb.firebaseio.com",
    projectId: "openchat2",
    storageBucket: "openchat2.appspot.com",
    messagingSenderId: "1046412600695",
    appId: "1:1046412600695:web:28f6c20c997c7e6d3aed72",
    measurementId: "G-KE583G0DX7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storage = firebase.storage();

  let username = "";
  let userRole = "Tester";
  let displayName = "";
  let autoScroll = true;

  // --- DOM Elementleri ---
  const authModal = document.getElementById('authModal');
  const chatDiv = document.getElementById('chat');
  const messagesDiv = document.getElementById('messages');
  const userIdDisplay = document.getElementById('user-id-display');
  const adminBtn = document.getElementById('adminBtn');
  const adminModal = document.getElementById('adminModalContainer');

  // --- Otomatik Giriş ---
  window.onload = () => {
    const rem = localStorage.getItem('rememberUser');
    if (rem) {
      db.ref("users/" + rem).once("value", snap => {
        if (snap.exists() && !snap.val().banned) {
          loginUser(rem);
        } else {
          localStorage.removeItem('rememberUser');
        }
      });
    }
  };

  // --- Giriş ---
  function login() {
    const userInput = document.getElementById("authUsername").value.trim();
    const passInput = document.getElementById("authPassword").value.trim();
    if (!userInput || !passInput) return;
    
    db.ref("users/" + userInput).once("value", snapshot => {
      if (snapshot.exists() && snapshot.val().password === passInput) {
        if (snapshot.val().banned) return alert("Hesabınız yasaklanmış.");
        localStorage.setItem('rememberUser', userInput);
        loginUser(userInput);
      } else {
        document.getElementById("authError").innerText = "Geçersiz kullanıcı adı veya şifre.";
      }
    });
  }

  // --- Kayıt ---
  function register() {
    const userInput = document.getElementById("authUsername").value.trim();
    const passInput = document.getElementById("authPassword").value.trim();
    if (!userInput || !passInput) return;
    
    db.ref("users/" + userInput).once("value", snapshot => {
      if (snapshot.exists()) {
        document.getElementById("authError").innerText = "Bu kullanıcı adı zaten kullanılıyor.";
      } else {
        db.ref("users/" + userInput).set({
          password: passInput,
          role: "Tester",
          displayName: userInput,
          registerDate: Date.now(),
        }).then(() => {
            localStorage.setItem('rememberUser', userInput);
            loginUser(userInput)
        });
      }
    });
  }

  // --- Giriş İşlemi ---
  function loginUser(user) {
    username = user;
    db.ref("users/" + username).once("value", s => {
      const userData = s.val() || {};
      userRole = userData.role || "Tester";
      displayName = userData.displayName || username;
      userIdDisplay.innerText = `Kimliğiniz: ${username}`;
      if (userRole === 'Admin') {
          adminBtn.style.display = 'block';
      }
    });

    authModal.style.display = "none";
    chatDiv.style.display = "flex";
    
    loadMessages();
  }

  // --- Çıkış ---
  function logout() {
    username = "";
    localStorage.removeItem('rememberUser');
    location.reload();
  }
  
  // --- Mesajları Yükle ve Görüntüle ---
  function renderMessage(key, val) {
    const existingWrapper = document.getElementById('wrapper-' + key);
    if(existingWrapper) existingWrapper.remove(); // Güncelleme için eskisini kaldır

    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper';
    wrapper.id = 'wrapper-' + key;

    const msgDiv = document.createElement('div');
    msgDiv.className = 'message';

    if (val.username === username) {
        wrapper.classList.add('sent');
        msgDiv.classList.add('sent');
    } else {
        wrapper.classList.add('received');
        msgDiv.classList.add('received');
    }
    
    const authorHtml = val.username !== username ? `<div class="author" onclick="showUserProfile('${val.username}')">${val.displayName || val.username}</div>` : '';
    const imageHtml = val.imageURL ? `<img src="${val.imageURL}" onclick="window.open('${val.imageURL}', '_blank')">` : '';
    
    let actionsHtml = '';
    if (val.username === username || userRole === 'Admin') {
        const messageForOnclick = JSON.stringify(val.message);
        actionsHtml = `
        <div class="message-actions">
            <button class="action-btn" title="Düzenle" onclick='editMessage("${key}", ${messageForOnclick})'>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg>
            </button>
            <button class="action-btn" title="Sil" onclick="deleteMessage('${key}')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" /></svg>
            </button>
        </div>`;
    }

    msgDiv.innerHTML = `
        ${authorHtml}
        <div class="content">${val.message}</div>
        ${imageHtml}
        <div class="time">${new Date(val.timestamp).toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'})}</div>
    `;
    
    wrapper.appendChild(msgDiv);
    wrapper.innerHTML += actionsHtml;
    messagesDiv.appendChild(wrapper);

    if (autoScroll) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  }

  function loadMessages() {
    const messagesRef = db.ref("messages_global").limitToLast(100);
    
    messagesRef.on("child_added", (snapshot) => {
        renderMessage(snapshot.key, snapshot.val());
    });
    
    messagesRef.on("child_changed", (snapshot) => {
        renderMessage(snapshot.key, snapshot.val());
    });

    db.ref("messages_global").on("child_removed", (snapshot) => {
        const wrapperToRemove = document.getElementById('wrapper-' + snapshot.key);
        if (wrapperToRemove) {
            wrapperToRemove.remove();
        }
    });
  }
  
  // --- Mesaj Silme ve Düzenleme ---
  function deleteMessage(key) {
      if (confirm('Bu mesajı silmek istediğinizden emin misiniz?')) {
          db.ref('messages_global/' + key).remove();
      }
  }

  function editMessage(key, oldMessage) {
      const newMessage = prompt('Mesajı düzenle:', oldMessage);
      if (newMessage && newMessage.trim() !== '') {
          db.ref('messages_global/' + key).update({ message: newMessage });
      }
  }

  // --- Mesaj Gönder ---
  function send() {
    const msgInput = document.getElementById("messageInput");
    const msg = msgInput.value.trim();
    if (!msg) return;

    db.ref("messages_global").push({
      username: username,
      displayName: displayName,
      message: msg,
      timestamp: Date.now()
    });
    msgInput.value = "";
  }

  // --- Cloudinary Widget ---
  const myWidget = cloudinary.createUploadWidget({
    cloudName: "dane3zz3e",
    uploadPreset: "OpenChat",
    sources: ['local', 'url', 'camera'],
    styles: {
        palette: {
            window: "#FFFFFF", sourceBg: "#F0F2F5", windowBorder: "#D4D9E1",
            tabIcon: "#005CFF", inactiveTabIcon: "#65676B", menuIcons: "#65676B",
            link: "#005CFF", action: "#005CFF", inProgress: "#005CFF",
            complete: "#31A24C", error: "#FA383E", textDark: "#050505", textLight: "#FFFFFF"
        }
    }
  }, (error, result) => {
    if (!error && result && result.event === "success") {
      db.ref("messages_global").push({
        username: username,
        displayName: displayName,
        message: "",
        imageURL: result.info.secure_url,
        timestamp: Date.now()
      });
    } else if (error) {
        console.error("Cloudinary Error:", error);
        alert("Resim yüklenirken bir hata oluştu. Lütfen konsolu kontrol edin.");
    }
  });

  document.getElementById("upload_widget").addEventListener("click", () => {
      if(myWidget) {
        myWidget.open();
      } else {
        console.error("Cloudinary widget is not initialized.");
      }
  }, false);
  
  // --- Admin Paneli ve Diğer Fonksiyonlar ---
  function openAdminModal() {
      adminModal.style.display = 'flex';
  }
  function closeAdminModal() {
      adminModal.style.display = 'none';
  }
  
  function banUser() {
      const userToBan = prompt("Banlanacak kullanıcı adını girin:");
      if (userToBan) {
          db.ref('users/' + userToBan).update({ banned: true });
          alert(userToBan + ' banlandı.');
      }
  }
  
  function unbanUser() {
      const userToUnban = prompt("Banı kaldırılacak kullanıcı adını girin:");
      if (userToUnban) {
          db.ref('users/' + userToUnban).update({ banned: false });
          alert(userToUnban + ' kullanıcısının banı kaldırıldı.');
      }
  }
  
  function deleteAllMessages() {
      if (confirm('Tüm mesajları silmek istediğinizden emin misiniz? Bu işlem geri alınamaz!')) {
          db.ref('messages_global').remove();
      }
  }
  
  function announce() {
      const announcement = prompt("Duyuru metnini girin:");
      if (announcement) {
          db.ref('messages_global').push({
              username: 'Admin',
              displayName: 'DUYURU',
              message: announcement,
              timestamp: Date.now(),
              isAnnouncement: true
          });
      }
  }
  
  function showUserProfile(user) {
      alert(`${user} kullanıcısının profili.`);
  }

</script>
</body>
</html>
