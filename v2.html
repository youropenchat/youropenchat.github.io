<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenChat - Yeni Tasarım</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Cloudinary Upload Widget SDK -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    /* --- Genel Ayarlar --- */
    :root {
      --background-color: #f0f2f5;
      --chat-background-color: #ffffff;
      --primary-color: #005cff;
      --sent-message-bg: #d9fdd3;
      --received-message-bg: #ffffff;
      --text-primary: #050505;
      --text-secondary: #65676b;
      --border-color: #e9edef;
      --whatsapp-bg-color: #e5ddd5;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
      overflow: hidden;
    }
    button, input {
      outline: none;
      font-family: inherit;
      border: none;
    }

    /* --- Ana Konteyner --- */
    #app-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 20px;
    }

    /* --- Modallar --- */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background: var(--chat-background-color);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .modal-content h2, .modal-content h3 {
        font-size: 22px;
        margin-bottom: 15px;
    }
    .modal-content p {
        color: #65676b;
        margin-bottom: 20px;
    }
    .modal-content input, .modal-content select {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
    }
    .modal-content .btn, .modal-content .close-btn {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        margin-top: 8px;
        cursor: pointer;
        color: white;
    }
    .modal-content .btn { background-color: var(--primary-color); }
    .modal-content .btn.danger { background-color: #dc3545; }
    .modal-content .btn.guest { background-color: #28a745; }
    .modal-content .close-btn { background-color: #6c757d; }
    .modal-content .error { color: #fa383e; margin-top: 12px; min-height: 20px; }
    .modal-content .admin-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-content .admin-buttons button { padding: 10px; border-radius: 8px; cursor: pointer; background-color: #f0f2f5; border: 1px solid #ddd; }


    /* --- Sohbet Konteyneri --- */
    #chat {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 900px;
      background: var(--chat-background-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* --- Sohbet Başlığı --- */
    #chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: #f0f2f5;
    }
    #chat-header .title-group { display: flex; align-items: center; gap: 10px; }
    #chat-header h2 { font-size: 18px; font-weight: 600; }
    #chat-header .status-tag { background-color: #31a24c; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    #chat-header .header-buttons { display: flex; align-items: center; gap: 10px; }
    #chat-header .btn-auth, #chat-header .btn-logout, #chat-header .btn-admin, #chat-header .btn-moderator {
        background-color: var(--primary-color); color: white; padding: 8px 16px;
        border-radius: 8px; font-weight: 500; cursor: pointer;
    }
    #chat-header .btn-logout { background-color: #fa383e; }
    #chat-header .btn-admin { background-color: #6c757d; }
    #chat-header .btn-moderator { background-color: #17a2b8; }

    /* --- Mesajlar Alanı --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: var(--whatsapp-bg-color);
      background-image: radial-gradient(circle, #d1d1d1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .message-wrapper { display: flex; margin-bottom: 12px; position: relative; }
    .message-wrapper.sent { justify-content: flex-end; }
    .message-wrapper.received { justify-content: flex-start; }
    .message { padding: 8px 12px; border-radius: 8px; max-width: 70%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .message.sent { background-color: var(--sent-message-bg); }
    .message.received { background-color: var(--received-message-bg); }
    .message .author { font-weight: 600; margin-bottom: 4px; font-size: 13px; color: var(--primary-color); cursor: pointer; }
    .message .author .role-tag {
        font-weight: 500; font-size: 10px; margin-left: 6px; padding: 2px 5px;
        border-radius: 4px; background-color: #6c757d; color: white;
    }
    .message .author .role-tag.admin { background-color: #dc3545; }
    .message .author .role-tag.moderator { background-color: #17a2b8; }
    .message .author .role-tag.guest { background-color: #28a745; }
    .message .content { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message .time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; text-align: right; }
    .message img, .message video { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
    .message a.file-link {
        display: flex; align-items: center; gap: 10px; padding: 10px;
        background-color: #f0f2f5; border-radius: 8px; text-decoration: none; color: var(--text-primary);
    }
    .message-actions {
        position: absolute; top: -15px; background-color: white; border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15); display: flex; gap: 5px; padding: 5px;
        opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: translateY(5px); pointer-events: none;
    }
    .message-wrapper:hover .message-actions { opacity: 1; transform: translateY(0); pointer-events: all; }
    .message-wrapper.sent .message-actions { right: 10px; }
    .message-wrapper.received .message-actions { left: 10px; }
    .action-btn { background: none; border: none; cursor: pointer; padding: 4px; }
    .action-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .action-btn:hover svg { color: var(--text-primary); }

    /* --- Giriş Alanı --- */
    #inputArea {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: #f0f2f5;
      border-top: 1px solid var(--border-color);
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 20px;
      background-color: white;
      font-size: 15px;
      border: 1px solid #ccd0d5;
    }
    #inputArea .icon-btn { background: none; border: none; padding: 8px; margin-left: 8px; cursor: pointer; }
    #inputArea .icon-btn svg { width: 24px; height: 24px; color: #65676b; }
    #inputArea .send-btn svg { color: var(--primary-color); }
    
    /* --- Easter Egg Styles --- */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background-color: #f00;
        opacity: 0.7;
        animation: fall 3s linear forwards;
    }
    @keyframes fall {
        to {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0;
        }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Giriş Yapın</h2>
            <p>Bu özelliği kullanmak için giriş yapmanız veya kayıt olmanız gerekmektedir.</p>
            <input type="text" id="authUsername" placeholder="Kullanıcı Adı" autocomplete="username">
            <input type="password" id="authPassword" placeholder="Şifre" autocomplete="current-password">
            <button class="btn" onclick="login()">Giriş Yap</button>
            <button class="btn danger" onclick="register()">Kayıt Ol</button>
            <button class="btn guest" onclick="closeAuthModal()">Misafir Olarak Devam Et</button>
            <div id="authError" class="error"></div>
        </div>
    </div>

    <div id="chat">
      <div id="chat-header">
        <div class="title-group">
            <h2>Genel Sohbet</h2>
            <span class="status-tag">Aktif</span>
        </div>
        <div id="header-auth-buttons" class="header-buttons">
            <button id="adminBtn" class="btn-admin" style="display: none;" onclick="openAdminModal()">Admin</button>
            <button id="moderatorBtn" class="btn-moderator" style="display: none;" onclick="openModeratorModal()">Moderatör</button>
            <button id="loginBtnHeader" class="btn-auth" onclick="showAuthModal()">Giriş Yap</button>
            <button id="logoutBtnHeader" class="btn-logout" style="display: none;" onclick="logout()">Çıkış</button>
        </div>
      </div>
      
      <div id="messages"></div>
      <div id="typingIndicator" style="padding: 5px 20px; height: 20px; font-style: italic; color: #65676b;"></div>

      <div id="inputArea">
        <input id="messageInput" placeholder="Bir mesaj yazın..." autocomplete="off" oninput="notifyTyping()" />
        <button id="upload_widget" class="icon-btn" title="Dosya Yükle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M14.707,12.707,5.293,3.293A1,1,0,0,1,6.707,1.879l10,10a1,1,0,0,1,0,1.414l-4,4a1,1,0,0,1-1.414-1.414L14.586,13H3a1,1,0,0,1,0-2H14.586Z" transform="rotate(45 12 12)"/></svg>
        </button>
        <button id="sendBtn" class="icon-btn send-btn" onclick="send()" title="Gönder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M2.01,21,23,12,2.01,3,2,10l15,2L2,14Z"/></svg>
        </button>
      </div>
    </div>
  </div>
  
  <div id="adminModalContainer" class="modal-overlay">
      <div class="modal-content">
          <h3>Admin Paneli</h3>
          <div class="admin-buttons">
              <button onclick="banUser()">Kullanıcı Banla</button>
              <button onclick="unbanUser()">Ban Kaldır</button>
              <button onclick="grantRole()">Rol Değiştir</button>
              <button onclick="deleteAllMessages()">Tüm Mesajları Sil</button>
              <button onclick="announce()">Duyuru Yap</button>
          </div>
          <br>
          <button class="close-btn" onclick="closeAdminModal()">Kapat</button>
      </div>
  </div>
  
  <div id="moderatorModalContainer" class="modal-overlay">
      <div class="modal-content">
          <h3>Moderatör Paneli</h3>
          <div class="admin-buttons">
              <button onclick="muteUser()">Kullanıcıyı Sustur</button>
          </div>
          <br>
          <button class="close-btn" onclick="closeModeratorModal()">Kapat</button>
      </div>
  </div>

  <div id="customAlertModal" class="modal-overlay"></div>

<script>
  // --- Firebase Konfigürasyonu ---
  const firebaseConfig = {
    apiKey: "AIzaSyAWA4a9VSTPUKWe4Pqsc6U6O0hrdFGlOd0",
    authDomain: "openchat2.firebaseapp.com",
    databaseURL: "https://openchat2-default-rtdb.firebaseio.com",
    projectId: "openchat2",
    storageBucket: "openchat2.appspot.com",
    messagingSenderId: "1046412600695",
    appId: "1:1046412600695:web:28f6c20c997c7e6d3aed72",
    measurementId: "G-KE583G0DX7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let username = "";
  let userRole = "Guest";
  let displayName = "";
  let guestDisplayName = sessionStorage.getItem('guestDisplayName') || null;
  let autoScroll = true;
  let typingTimeout;

  // --- DOM Elementleri ---
  const authModal = document.getElementById('authModal');
  const chatDiv = document.getElementById('chat');
  const messagesDiv = document.getElementById('messages');
  const loginBtnHeader = document.getElementById('loginBtnHeader');
  const logoutBtnHeader = document.getElementById('logoutBtnHeader');
  const adminBtn = document.getElementById('adminBtn');
  const moderatorBtn = document.getElementById('moderatorBtn');
  const adminModal = document.getElementById('adminModalContainer');
  const moderatorModal = document.getElementById('moderatorModalContainer');
  const messageInput = document.getElementById('messageInput');
  const typingIndicator = document.getElementById('typingIndicator');

  // --- Sayfa Yüklendiğinde ---
  window.onload = () => {
    loadMessages();
    const rememberedUser = localStorage.getItem('rememberUser');
    if(rememberedUser) {
        loginUser(rememberedUser);
    }
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            send();
        }
    });
    listenForTyping();
  };
  
  // --- Giriş Kontrolü ---
  function showAuthModal() {
      authModal.style.display = 'flex';
  }

  function closeAuthModal() {
      authModal.style.display = 'none';
  }

  // --- Giriş ---
  function login() {
    const userInput = document.getElementById("authUsername").value.trim();
    const passInput = document.getElementById("authPassword").value.trim();
    if (!userInput || !passInput) return;
    
    db.ref("users/" + userInput).once("value", snapshot => {
      if (snapshot.exists() && snapshot.val().password === passInput) {
        if (snapshot.val().banned) return showAlert("Hesabınız yasaklanmış.");
        localStorage.setItem('rememberUser', userInput);
        loginUser(userInput);
      } else {
        document.getElementById("authError").innerText = "Geçersiz kullanıcı adı veya şifre.";
      }
    });
  }

  // --- Kayıt ---
  function register() {
    const userInput = document.getElementById("authUsername").value.trim();
    const passInput = document.getElementById("authPassword").value.trim();
    if (!userInput || !passInput) return;
    
    db.ref("users/" + userInput).once("value", snapshot => {
      if (snapshot.exists()) {
        document.getElementById("authError").innerText = "Bu kullanıcı adı zaten kullanılıyor.";
      } else {
        db.ref("users/" + userInput).set({
          password: passInput, role: "Tester", displayName: userInput, registerDate: Date.now(),
        }).then(() => {
            localStorage.setItem('rememberUser', userInput);
            loginUser(userInput)
        });
      }
    });
  }

  // --- Giriş İşlemi ---
  function loginUser(user) {
    username = user;
    guestDisplayName = null;
    sessionStorage.removeItem('guestDisplayName');
    db.ref("users/" + username).once("value", s => {
      const userData = s.val() || {};
      userRole = userData.role || "Tester";
      displayName = userData.displayName || username;
      if (userRole === 'Admin') {
          adminBtn.style.display = 'block';
      }
      if (userRole === 'Moderator') {
          moderatorBtn.style.display = 'block';
      }
    });

    closeAuthModal();
    loginBtnHeader.style.display = 'none';
    logoutBtnHeader.style.display = 'block';
  }

  // --- Çıkış ---
  function logout() {
    username = "";
    userRole = "Guest";
    displayName = "";
    guestDisplayName = null;
    localStorage.removeItem('rememberUser');
    sessionStorage.removeItem('guestDisplayName');
    loginBtnHeader.style.display = 'block';
    logoutBtnHeader.style.display = 'none';
    adminBtn.style.display = 'none';
    moderatorBtn.style.display = 'none';
    showAlert("Çıkış yapıldı.");
  }
  
  // --- Mesajları Yükle ---
  function loadMessages() {
    const messagesRef = db.ref("messages_global").limitToLast(100);
    
    messagesRef.on("child_added", (snapshot) => renderMessage(snapshot.key, snapshot.val()));
    messagesRef.on("child_changed", (snapshot) => renderMessage(snapshot.key, snapshot.val()));
    db.ref("messages_global").on("child_removed", (snapshot) => {
        const wrapperToRemove = document.getElementById('wrapper-' + snapshot.key);
        if (wrapperToRemove) wrapperToRemove.remove();
    });
  }
  
  // --- Mesajı Ekrana Çiz ---
  function renderMessage(key, val) {
    const existingWrapper = document.getElementById('wrapper-' + key);
    if(existingWrapper) existingWrapper.remove();

    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper';
    wrapper.id = 'wrapper-' + key;

    const msgDiv = document.createElement('div');
    msgDiv.className = 'message';

    if (val.username === username || (val.username === 'Guest' && val.displayName === guestDisplayName)) {
        wrapper.classList.add('sent');
        msgDiv.classList.add('sent');
    } else {
        wrapper.classList.add('received');
        msgDiv.classList.add('received');
    }
    
    let authorHtml = '';
    if (val.username !== username && val.username !== 'Guest') {
        authorHtml = `<div class="author" onclick="showUserProfile('${val.username}')">${val.displayName || val.username}</div>`;
        db.ref('users/' + val.username).once('value', userSnap => {
            const userData = userSnap.val() || {};
            const userRoleTag = userData.role ? `<span class="role-tag ${userData.role.toLowerCase()}">${userData.role}</span>` : '';
            const authorDiv = wrapper.querySelector('.author');
            if(authorDiv) authorDiv.innerHTML = `${val.displayName || val.username} ${userRoleTag}`;
        });
    } else if (val.username === 'Guest') {
        authorHtml = `<div class="author">${val.displayName} <span class="role-tag guest">MİSAFİR</span></div>`;
    }

    let mediaHtml = '';
    if (val.mediaURL) {
        const url = val.mediaURL.toLowerCase();
        const isVideo = url.includes('.mp4') || url.includes('.webm') || url.includes('.ogg');
        if (isVideo) {
            mediaHtml = `<video src="${val.mediaURL}" controls style="max-width: 100%; border-radius: 8px; margin-top: 5px;"></video>`;
        } else {
            mediaHtml = `<img src="${val.mediaURL}" onclick="window.open('${val.mediaURL}', '_blank')" style="max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer;">`;
        }
    }
    
    let actionsHtml = '';
    if (username && (val.username === username || userRole === 'Admin')) {
        const messageForOnclick = JSON.stringify(val.message);
        actionsHtml = `
        <div class="message-actions">
            <button class="action-btn" title="Düzenle" onclick='editMessage("${key}", ${messageForOnclick})'>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg>
            </button>
            <button class="action-btn" title="Sil" onclick="deleteMessage('${key}')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" /></svg>
            </button>
        </div>`;
    }

    let contentHtml = val.message;
    const siteRegex = /^site:\/\/(https?:\/\/[^\s]+)/;
    const match = contentHtml.match(siteRegex);
    if (match) {
        const url = match[1];
        contentHtml = `<a href="${url}" target="_blank" class="file-link">${url}</a>`;
    }

    msgDiv.innerHTML = `
        ${authorHtml}
        <div class="content">${contentHtml}</div>
        ${mediaHtml}
        <div class="time">${new Date(val.timestamp).toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'})}</div>
    `;
    
    wrapper.appendChild(msgDiv);
    wrapper.innerHTML += actionsHtml;
    messagesDiv.appendChild(wrapper);

    if (autoScroll) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    // Easter Eggs
    if(val.message.toLowerCase() === 'matrix') partyTime('matrix');
    if(val.message.toLowerCase() === 'party') partyTime('party');
  }

  // --- Mesaj Gönder ---
  function send() {
    if (!username && !guestDisplayName) {
        const tempName = "Misafir" + Math.floor(Math.random() * 1000);
        guestDisplayName = tempName;
        sessionStorage.setItem('guestDisplayName', tempName);
    }

    const msgInput = document.getElementById("messageInput");
    let msg = msgInput.value.trim();
    if (!msg) return;

    if (msg.toLowerCase() === '/shrug') {
        msg = '¯\\_(ツ)_/¯';
    } else if (msg.toLowerCase() === '/flip') {
        msg = '(╯°□°）╯︵ ┻━┻';
    }

    const currentUsername = username || "Guest";
    const currentDisplayName = username ? displayName : guestDisplayName;

    db.ref("messages_global").push({
      username: currentUsername,
      displayName: currentDisplayName,
      message: msg,
      timestamp: Date.now()
    });
    msgInput.value = "";
    db.ref('typing/' + (username || guestDisplayName)).remove();
  }
  
  // --- Mesaj Silme ve Düzenleme ---
  function deleteMessage(key) {
      showConfirm('Bu mesajı silmek istediğinizden emin misiniz?', () => {
          db.ref('messages_global/' + key).remove();
      });
  }

  function editMessage(key, oldMessage) {
      showPrompt('Mesajı düzenle:', oldMessage, (newMessage) => {
          if (newMessage && newMessage.trim() !== '') {
              db.ref('messages_global/' + key).update({ message: newMessage });
          }
      });
  }

  // --- Cloudinary Widget ---
  const myWidget = cloudinary.createUploadWidget({
    cloudName: "dane3zz3e",
    uploadPreset: "OpenChat",
    sources: ['local', 'url', 'camera'],
    folder: 'openchat_uploads',
    styles: {
        palette: {
            window: "#FFFFFF", sourceBg: "#F0F2F5", windowBorder: "#D4D9E1",
            tabIcon: "#005CFF", inactiveTabIcon: "#65676B", menuIcons: "#65676B",
            link: "#005CFF", action: "#005CFF", inProgress: "#005CFF",
            complete: "#31A24C", error: "#FA383E", textDark: "#050505", textLight: "#FFFFFF"
        }
    }
  }, (error, result) => {
    if (!error && result && result.event === "success") {
      db.ref("messages_global").push({
        username: username,
        displayName: displayName,
        message: result.info.original_filename,
        mediaURL: result.info.secure_url,
        timestamp: Date.now()
      });
    } else if (error) {
        showAlert("Dosya yüklenirken bir hata oluştu: " + error.message);
    }
  });

  document.getElementById("upload_widget").addEventListener("click", () => {
      if (!username) {
          showAuthModal();
      } else {
          myWidget.open();
      }
  }, false);
  
  // --- Admin & Moderatör Panelleri ---
  function openAdminModal() { adminModal.style.display = 'flex'; }
  function closeAdminModal() { adminModal.style.display = 'none'; }
  function openModeratorModal() { moderatorModal.style.display = 'flex'; }
  function closeModeratorModal() { moderatorModal.style.display = 'none'; }
  
  function banUser() {
      showPrompt("Banlanacak kullanıcı adını girin:", "", (userToBan) => {
          if (userToBan) {
              db.ref('users/' + userToBan).update({ banned: true });
              showAlert(userToBan + ' banlandı.');
          }
      });
  }
  
  function unbanUser() {
      showPrompt("Banı kaldırılacak kullanıcı adını girin:", "", (userToUnban) => {
          if (userToUnban) {
              db.ref('users/' + userToUnban).update({ banned: false });
              showAlert(userToUnban + ' kullanıcısının banı kaldırıldı.');
          }
      });
  }
  
  function muteUser() {
      showPrompt("Susturulacak kullanıcı adını girin:", "", (userToMute) => {
          if (userToMute) {
              showPrompt("Süre (dakika):", "60", (duration) => {
                  if(duration && !isNaN(duration)) {
                      const muteUntil = Date.now() + parseInt(duration) * 60 * 1000;
                      db.ref('users/' + userToMute).update({ mutedUntil: muteUntil });
                      showAlert(`${userToMute}, ${duration} dakika boyunca susturuldu.`);
                  }
              });
          }
      });
  }
  
  function deleteAllMessages() {
      showConfirm('Tüm mesajları silmek istediğinizden emin misiniz? Bu işlem geri alınamaz!', () => {
          db.ref('messages_global').remove();
      });
  }
  
  function announce() {
      showPrompt("Duyuru metnini girin:", "", (announcement) => {
          if (announcement) {
              db.ref('messages_global').push({
                  username: 'Admin',
                  displayName: 'DUYURU',
                  message: announcement,
                  timestamp: Date.now(),
                  isAnnouncement: true
              });
          }
      });
  }
  
  function grantRole() {
      showPrompt("Rolü değiştirilecek kullanıcı adını girin:", "", (targetUser) => {
          if (targetUser) {
              showPrompt("Yeni rolü girin (Admin, Moderator, Tester):", "Tester", (newRole) => {
                  if (newRole && ['Admin', 'Moderator', 'Tester'].includes(newRole)) {
                      db.ref('users/' + targetUser).update({ role: newRole });
                      showAlert(`${targetUser} kullanıcısının rolü ${newRole} olarak ayarlandı.`);
                  } else {
                      showAlert("Geçersiz rol girdiniz.");
                  }
              });
          }
      });
  }
  
  function showUserProfile(user) {
      if (!user || user === 'Guest') return;
      db.ref('users/' + user).once('value', snap => {
          if (snap.exists()) {
              const data = snap.val();
              const regDate = new Date(data.registerDate).toLocaleDateString('tr-TR');
              showAlert(`Kullanıcı: ${data.displayName || user}\nRol: ${data.role}\nKayıt Tarihi: ${regDate}`);
          } else {
              showAlert("Kullanıcı bilgisi bulunamadı.");
          }
      });
  }
  
  // --- Custom Modal Functions ---
  const alertModal = document.getElementById('customAlertModal');

  function showAlert(message) {
      const content = `
        <div class="modal-content">
            <h3>Bilgi</h3>
            <p>${message}</p>
            <button class="close-btn" onclick="closeCustomAlert()">Kapat</button>
        </div>`;
      alertModal.innerHTML = content;
      alertModal.style.display = 'flex';
  }

  function showConfirm(message, callback) {
      const content = `
        <div class="modal-content">
            <h3>Onay</h3>
            <p>${message}</p>
            <button class="btn" id="confirmBtnYes">Evet</button>
            <button class="close-btn" id="confirmBtnNo">Hayır</button>
        </div>`;
      alertModal.innerHTML = content;
      alertModal.style.display = 'flex';
      document.getElementById('confirmBtnYes').onclick = () => {
          if(callback) callback();
          closeCustomAlert();
      };
      document.getElementById('confirmBtnNo').onclick = closeCustomAlert;
  }

  function showPrompt(message, defaultValue, callback) {
      const content = `
        <div class="modal-content">
            <h3>Giriş</h3>
            <p>${message}</p>
            <input type="text" id="promptInput" value="${defaultValue || ''}">
            <button class="btn" id="promptBtnOk">Tamam</button>
            <button class="close-btn" id="promptBtnCancel">İptal</button>
        </div>`;
      alertModal.innerHTML = content;
      alertModal.style.display = 'flex';
      document.getElementById('promptInput').focus();
      document.getElementById('promptBtnOk').onclick = () => {
          const value = document.getElementById('promptInput').value;
          if (callback) callback(value);
          closeCustomAlert();
      };
      document.getElementById('promptBtnCancel').onclick = () => {
          if (callback) callback(null);
          closeCustomAlert();
      };
  }

  function closeCustomAlert() {
      alertModal.style.display = 'none';
  }

  // --- Yeni Özellikler ---
  function notifyTyping() {
      const user = username || guestDisplayName;
      if (!user) return;
      const typingRef = db.ref('typing/' + user);
      typingRef.set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
          typingRef.remove();
      }, 2000);
  }

  function listenForTyping() {
      db.ref('typing').on('value', snap => {
          const typingUsers = snap.val() || {};
          const currentUser = username || guestDisplayName;
          let text = '';
          const users = Object.keys(typingUsers).filter(u => u !== currentUser);
          if (users.length > 0) {
              text = `${users.join(', ')} yazıyor...`;
          }
          typingIndicator.textContent = text;
      });
  }

  function partyTime(type) {
      if (type === 'matrix') {
          document.body.style.transition = 'background-color 0.5s, color 0.5s';
          document.body.style.backgroundColor = '#000';
          document.body.style.color = '#0F0';
          setTimeout(() => {
              document.body.style.backgroundColor = '';
              document.body.style.color = '';
          }, 5000);
          return;
      }
      for (let i = 0; i < 100; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.animationDuration = Math.random() * 2 + 3 + 's';
          confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
      }
  }

</script>
</body>
</html>
